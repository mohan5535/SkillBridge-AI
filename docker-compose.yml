services:
  db:
    image: postgres:17-alpine
    container_name: skillbridge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-skillbridge_db}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
      - ./migrations/002_add_user_auth_credentials.sql:/docker-entrypoint-initdb.d/03_migration002.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-skillbridge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillbridge-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-skillbridge_db}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in environment}
      PGSSL: ${PGSSL:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in environment}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>= 32 random chars)}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET must be set (>= 32 random chars)}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set (>= 32 random chars)}
      ALLOW_DEMO_SESSION: ${ALLOW_DEMO_SESSION:-false}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
